<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두근두근♥ 유우쨩 호감도 올리기!</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gugi&display=swap" rel="stylesheet">
<style>
/* 뚝딱감자체: ddukddak.woff2 파일이 자동 적용돼 */
@font-face{font-family:'DDukDDak';src:url('ddukddak.woff2') format('woff2');font-display:swap}
:root{--pk:#ff8fc4;--pk2:#ff5aa8;--pk3:#ffd9ec;--pu:#8a1f7f;--px:'DDukDDak','Gugi','DotGothic16','Apple SD Gothic Neo',sans-serif;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd6e8}
body{font-family:var(--px);color:#fff;user-select:none}
#stage{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#333}
.layer{position:absolute;inset:0}
#bg{background-size:cover;background-position:center;transition:background .5s}
#dim{background:rgba(255,226,240,.3);opacity:0;transition:opacity .4s}
#sprite{position:absolute;inset:0;pointer-events:none}
.sw{position:absolute;left:0;right:0;bottom:0;height:96%;display:flex;align-items:flex-end;justify-content:center}
.ci{position:absolute;left:50%;transform:translateX(-50%);object-fit:contain;max-width:100%}
.fd{-webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent);mask-image:linear-gradient(to bottom,#000 78%,transparent)}
#sprite video{height:90%;width:auto;max-width:80%;object-fit:contain;border:3px solid #fff;border-radius:10px;margin-bottom:2%;background:#000}
.ph.v{aspect-ratio:9/16;height:90%;border-radius:10px;align-items:center;padding:0;margin-bottom:2%;background:rgba(138,31,127,.45);text-align:center}
.ph.v small{position:static;margin-top:6px;display:block}
.ph{position:relative;height:90%;aspect-ratio:3/5;border-radius:40% 40% 6px 6px;display:flex;justify-content:center;padding-top:12%;font-size:clamp(40px,10vw,90px);border:3px dashed rgba(255,255,255,.9)}
.ph small{position:absolute;bottom:8%;font-size:clamp(11px,2vw,15px)}
.o{text-shadow:-2px 0 #fff,2px 0 #fff,0 -2px #fff,0 2px #fff,-2px -2px #fff,2px 2px #fff,-2px 2px #fff,2px -2px #fff,0 4px 0 #e0509a}
.logo{position:absolute;top:calc(2% + env(safe-area-inset-top,0px));left:max(2%,env(safe-area-inset-left));text-align:center;line-height:1}
.logo .dk{display:inline-block;background:#fff;color:var(--pk2);border-radius:20px 20px 20px 2px;padding:3px 12px;font-size:clamp(9px,1.7vw,15px);border:2px solid var(--pk)}
.logo .lt{color:var(--pk);font-size:clamp(16px,3.6vw,34px);margin-top:3px}
.logo .sb{font-size:clamp(7px,1.2vw,10px);color:var(--pk2);margin-top:2px}
.logo .rb{position:absolute;right:-18px;top:-8px;font-size:clamp(14px,3vw,26px);transform:rotate(15deg)}
#gauge{position:absolute;top:calc(2% + env(safe-area-inset-top,0px));right:max(2%,env(safe-area-inset-right));z-index:5;display:none;align-items:center;gap:6px;background:rgba(255,255,255,.75);border:2px solid var(--pk);padding:3px 10px;font-size:clamp(10px,1.9vw,15px);color:var(--pk2)}
#hearts{letter-spacing:1px;color:var(--pk2)}
#num{min-width:2.2em;text-align:right;color:var(--pu)}
.fx{position:absolute;pointer-events:none;color:#fff;text-shadow:0 0 6px var(--pk2),0 0 12px var(--pk);z-index:12;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg);opacity:0}}
#pop{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:clamp(26px,7vw,56px);color:var(--pk2);opacity:0;pointer-events:none;z-index:11}
#pop.go{animation:pop 1.3s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}25%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
#box{position:absolute;left:5%;right:5%;bottom:11%;min-height:27%;display:none;z-index:4}
#in{position:absolute;inset:0;background:rgba(255,120,185,.5);border:3px solid #fff;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#in:before{content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.6);pointer-events:none}
#name{position:absolute;left:-3px;top:-34px;height:34px;background:#fff;color:var(--pu);padding:0 36px 0 14px;display:flex;align-items:center;font-size:clamp(12px,2.3vw,19px);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 100%,0 100%)}
#name:before{content:"♥";color:var(--pk2);margin-right:6px}
#txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 40px;font-size:clamp(13px,2.7vw,22px);line-height:1.5;color:#fff;text-shadow:1px 1px 0 var(--pk2),0 0 6px rgba(214,64,127,.7)}
#next{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);color:#fff;font-size:12px;animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translate(-50%,4px)}}
#sa{position:absolute;right:8px;bottom:3px;font-family:'DotGothic16',var(--px);font-size:clamp(9px,1.5vw,12px);display:flex;gap:10px}
#sa span{cursor:pointer;color:#fff;opacity:.85}#sa span.on{color:#ffe14d;opacity:1}
#nav{position:absolute;left:max(3%,env(safe-area-inset-left));bottom:2%;display:none;gap:6px;z-index:5}
.nb{font-family:'DotGothic16',var(--px);font-size:clamp(9px,1.6vw,13px);background:rgba(255,143,196,.9);color:#fff;border:2px solid #fff;padding:2px 12px;cursor:pointer;border-radius:14px}
#choices{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,1.4vw,11px);background:rgba(138,31,127,.3);z-index:6;padding:4%}
#q{background:#fff;color:var(--pu);padding:5px 20px;font-size:clamp(13px,2.5vw,21px);border:3px solid var(--pk);margin-bottom:4px}
.ch{width:min(80%,520px);padding:clamp(7px,1.6vw,12px) 16px;background:rgba(255,120,185,.78);border:3px solid #fff;font:inherit;font-size:clamp(12px,2.3vw,19px);color:#fff;text-shadow:1px 1px 0 var(--pk2);cursor:pointer;text-align:left}
.ch:before{content:"→ ";opacity:0}
.ch:hover,.ch:active{background:#fff;color:var(--pk2);text-shadow:none}.ch:hover:before,.ch:active:before{opacity:1}
#title{z-index:8;background:#f4a6cc;overflow:hidden}
#title:before,#end:before{content:"";position:absolute;inset:-30px;background:var(--bgi) center/cover;filter:blur(20px)}
#tsp{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:92%}
#tsp img{height:100%}
#tlogo{position:relative;z-index:2;text-align:center;line-height:1.05;margin-top:1%}
#tlogo .dk{display:inline-block;background:#fff;color:var(--pk2);border:3px solid var(--pk);border-radius:26px 26px 26px 3px;padding:4px 18px;font-size:clamp(11px,2.4vw,22px)}
#tlogo .lt{color:#c2185b;font-size:clamp(20px,4.6vw,56px);margin-top:4px}
#tright{position:absolute;left:50%;right:3%;top:34%;bottom:6%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,5vh,34px);z-index:2}
#tlogo .rb{position:absolute;right:-8%;top:-4%;font-size:clamp(22px,5vw,46px);transform:rotate(18deg)}
#tlogo .sb{color:var(--pu);font-size:clamp(9px,1.7vw,14px);margin-top:4px}
.bubble{position:relative;z-index:2;font:inherit;font-size:clamp(14px,3vw,24px);color:var(--pk2);background:#fff;border:4px solid var(--pk);border-radius:30px;padding:7px 38px;cursor:pointer;box-shadow:0 4px 0 #e0509a;animation:bob2 1.2s steps(2) infinite}
.bubble:after{content:"";position:absolute;left:28px;bottom:-14px;border:9px solid transparent;border-top:12px solid var(--pk);border-bottom:0}
@keyframes bob2{50%{transform:translateY(4px)}}
.sp{position:absolute;pointer-events:none;color:#fff;text-shadow:0 0 6px var(--pk2);animation:tw 2.4s steps(6) infinite;z-index:7}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1) rotate(30deg)}}
#end{display:none;z-index:9;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:4%;background:#ffc4dc;overflow:hidden}
#end h2{margin:0;font-weight:400;font-size:clamp(26px,7vw,72px);color:var(--pu);line-height:1.1}
#end p{margin:0;font-size:clamp(12px,2.5vw,20px);color:#fff;text-shadow:1px 1px 0 var(--pu),0 0 8px var(--pu)}
.wing{position:relative;font:inherit;font-size:clamp(14px,2.8vw,22px);color:#fff;background:linear-gradient(#ff5aa8,#d6307f);border:3px solid #fff;border-radius:6px;padding:8px 30px;cursor:pointer;box-shadow:0 0 0 2px var(--pu)}
#tbox,#ew{z-index:1;position:absolute;left:50%;top:50%;width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;transform:translate(-50%,-50%);container-type:inline-size;background:#ffc4dc}
#timg{width:100%;height:100%;display:block}
#tbox #tright{left:52%;right:3%;top:36%;bottom:8%;gap:2.2cqw}
#tbox #tlogo .dk{font-size:2.4cqw;border-width:.3cqw;padding:.3cqw 1.6cqw}
#tbox #tlogo .lt{font-size:4.8cqw}
#tbox #tlogo .sb{font-size:1.5cqw}
#tbox #tlogo .rb{font-size:4cqw}
#tbox .bubble{font-size:2.8cqw;padding:.6cqw 4cqw;border-width:.35cqw}
#ew video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#et{position:absolute;left:15%;right:15%;top:64%;display:flex;flex-direction:column;align-items:center;gap:1.2vw;text-align:center}
.eh{font-size:clamp(13px,2.6vw,30px);font-size:2.8cqw;color:#c2185b;line-height:1.15}
.es{font-size:clamp(10px,1.6vw,18px);font-size:1.8cqw;color:#8a1f7f;text-shadow:-1px 0 #fff,1px 0 #fff,0 -1px #fff,0 1px #fff,-1px -1px #fff,1px 1px #fff}
#et .wing{font-size:clamp(10px,1.8vw,18px);font-size:1.9cqw;padding:.5em 2em;margin-top:.4em}
#rot{display:none;position:fixed;inset:0;z-index:99;background:linear-gradient(135deg,#ffd6e8,#e8d6ff);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-size:20px;color:var(--pk2);padding:20px}
#rot b{font-size:64px;font-weight:400;display:block;animation:rt 1.6s ease-in-out infinite}
@keyframes rt{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <div id="dim" class="layer"></div>
  <div id="sprite"></div>
  <div class="logo" id="mini" style="display:none"><span class="dk">두근두근♥</span><div class="lt o">유우쨩 호감도!</div></div>
  <div id="gauge">유우시 호감도 <span id="hearts"></span><b id="num">0</b></div>
  <div id="pop" class="o"></div>
  <div id="box"><div id="in"></div><div id="name"></div><div id="txt"></div><span id="next">▼</span><div id="sa"><span id="skip">skip</span><span id="auto">⇄auto</span></div></div>
  <div id="nav"><span class="nb" id="home">Home</span><span class="nb" id="mute">♪ ON</span></div>
  <div id="choices" class="layer"><div id="q"></div></div>
  <div id="end" class="layer"></div>
  <div id="title" class="layer"></div>
</div>
<div id="rot"><b>📱</b>핸드폰을 가로로 돌려주세요!<br>♥ 가로 화면에서만 할 수 있어요 ♥</div>
<script>
// ====== 여기만 바꾸면 돼! 사진 경로 (비워두면 임시 화면) ======
const V={gym:"gym.mp4",store:"store.mp4",end:"ending.mp4"};
const IMG = {
  titleBg: "title.jpg",            // 시작 화면 (원본 비율 그대로)
  endVideo: V.end,                     // 엔딩 영상 (원본 비율 그대로)
  endPoster: "ending-poster.jpg",  // 영상 로딩 전/실패 시 보이는 첫 화면
  chars: {                             // 대사별 인물 사진
    riku_goal:"riku_goal.webp", riku_flirt:"riku_flirt.webp", riku_hi:"riku_hi.webp",
    yuu_hi:"yuu_hi.webp", riku_gym:"riku_gym.webp", yuu_gym:"yuu_gym.webp",
    yuu_store:"yuu_store.webp", yuu_eve:"yuu_eve.webp", yuu_eve2:"yuu_eve2.webp"
  },
  bg: { gate:"gate.jpg", room:"room.jpg", gym:"gym.jpg", store:"store.jpg", rooftop:"rooftop.jpg" }
};
const THRESHOLD = 80;
// ====== 장면 & 대사 (자유롭게 수정!) ======
const S = [
 {bg:"gate", dim:1, sp:"riku_goal", who:"리쿠", t:"나는 리쿠! 오늘은 중요한 목표가 있어."},
 {bg:"gate", dim:1, sp:"riku_flirt", who:"리쿠", t:"같은 학교 후배 유우쨩을… 꼬실 거야! 도와줄래?"},
 {bg:"room", sp:"riku_hi", who:"리쿠", t:"안녕? 유우쨩!"},
 {bg:"room", sp:"yuu_hi", who:"유우시", t:"리쿠 선배…. 안녕하세요오…."},
 {bg:"room", sp:"riku_gym", who:"리쿠", t:"이제 체육하러 가자!"},
 {bg:"gym", sp:"yuu_gym", who:"유우시", t:"체육관이다! 선배, 오늘은 뭐 할 거예요?"},
 {q:"무슨 종목을 할까?", o:[
   // v: 영상 (위의 V에서 경로 수정, ""로 두면 임시 화면)
   {t:"⚽ 축구", p:25, v:V.gym, r:"축구… 골 넣는 선배… 멋져요…"},
   {t:"🏐 배구", p:30, v:V.gym, r:"배구 멋져요… 고독한 늑대 같아…"},
   {t:"⚾ 야구", p:20, v:V.gym, r:"야구… 폼이 너무 멋있어요… 두근…"},
   {t:"🏃 달리기", p:25, v:V.gym, r:"가코이..❤️"}]},
 {bg:"store", sp:"yuu_store", who:"유우시", t:"(꼬르륵..) 배고프네… 냐암…"},
 {q:"유우시한테 뭘 사줄까?", o:[
   // v: 유우시가 먹는 세로 영상 경로 (예: "boba.mp4")
   {t:"🧋 버블티 사주기", p:30, v:V.store, r:"맛있어용..!"},
   {t:"🍜 라면 사주기", p:25, v:V.store, r:"오이시…"},
   {t:"🍮 까눌레 사주기", p:30, v:V.store, r:"맛있어용..!"},
   {t:"🍡 모찌 사주기", p:25, v:V.store, r:"오이시…"}]},
 {bg:"rooftop", sp:"yuu_eve", who:"유우시", t:"벌써 해가 지네요… 오늘 정말 즐거웠어요."},
 {q:"헤어지기 전에, 뭐라고 말할까?", o:[
   {t:"💬 “오늘 같이 있어서 좋았어.”", p:30, r:"저도요… 선배랑 있으면 두근두근해요."},
   {t:"🎁 작은 선물 건네기", p:35, r:"이거 저 주는 거예요? 평생 간직할게요!"},
   {t:"🌙 “내일도 같이 갈래?”", p:30, r:"네! 내일도, 모레도 좋아요!"},
   {t:"😳 “…나 너 좋아해.”", p:35, r:"…!! 저, 저도요 선배…!"}]},
];
// ====== 엔진 ======
const $=id=>document.getElementById(id);
let i=0,love=0,typing=null,full="",auto=false,skip=false,doneAt=0;
const PH={riku:["🧑","리쿠 사진","#7aa8ff"],yuu:["🌸","유우시 사진","#ff7eb6"]};
function spriteHTML(k){
  if(IMG.chars[k]){const f=FIT[k]||[90,8,0];return `<img class="ci${f[2]?' fd':''}" style="height:${f[0]}%;top:${f[1]}%" src="${IMG.chars[k]}" alt="">`;}
  const [e,l,c]=PH[k.startsWith('riku')?'riku':'yuu'];return `<div class="sw"><div class="ph" style="background:${c}99">${e}<small>${l}</small></div></div>`;
}
function vidHTML(n){
  if(n.v)return `<div class="sw"><video src="${n.v}" playsinline></video></div>`;
  return `<div class="sw"><div class="ph v">🎬<small>세로 영상 자리<br>${n.vl||''}</small></div></div>`;
}
function playVid(v,done){
  const end=v.id==='ev';setVol(end?0:BGM.duck);
  v.onended=()=>{if(!end)bgmNormal();if(done)done();};v.muted=false;
  const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;v.play().catch(()=>{});});
}
// 인물 크기 조절: [높이%, 위쪽 위치%, 아래쪽 흐리게(1/0)] — 숫자만 바꾸면 크기/위치가 바뀌어
const FIT={riku_goal:[72,17,0],riku_flirt:[66,23,0],riku_hi:[100,0,0],yuu_hi:[92,8,0],riku_gym:[78,11,0],yuu_gym:[66,23,0],yuu_store:[90,10,0],yuu_eve:[66,23,0],yuu_eve2:[62,27,0]};
const REPLY={gym:'yuu_gym',store:'yuu_store',rooftop:'yuu_eve2'};
const BGC={gate:"#bfe3ff,#e9f6ff",room:"#d8e4ff,#f1e8ff",gym:"#ffe3a8,#fff3d6",store:"#ffd0b0,#fff0e0",rooftop:"#ffb07a,#ffe3b0"};
function setBg(k){const u=IMG.bg[k];$('bg').style.backgroundImage=u?`url(${u})`:`linear-gradient(160deg,${BGC[k]})`;}
function sparkle(p,n){
  for(let j=0;j<n;j++){
    const s=document.createElement('span');s.className='sp';s.textContent=['✦','✧','♥','★'][j%4];
    s.style.left=Math.random()*94+'%';s.style.top=Math.random()*90+'%';
    s.style.fontSize=(12+Math.random()*20)+'px';s.style.animationDelay=(Math.random()*2.4)+'s';p.appendChild(s);
  }
}
function burst(){
  const g=$('gauge').getBoundingClientRect(),st=$('stage').getBoundingClientRect();
  const cx=g.left-st.left+g.width/2,cy=g.top-st.top+g.height/2;
  for(let j=0;j<14;j++){
    const s=document.createElement('span');s.className='fx';s.textContent=['✦','✧','♥','★'][j%4];
    const a=Math.random()*6.28,d=30+Math.random()*60;
    s.style.left=cx+'px';s.style.top=cy+'px';s.style.fontSize=(12+Math.random()*14)+'px';
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
    $('stage').appendChild(s);setTimeout(()=>s.remove(),1000);
  }
}
// ====== 배경음악 (bgm.mp3) ======
const BGM={src:"bgm.mp3",vol:.3,duck:.06};   // vol: 평소 볼륨(0~1), duck: 영상 나올 때 볼륨
const bgm=new Audio(BGM.src);bgm.loop=true;
let ctx=null,gain=null,bgmOn=true,bgmStarted=false;
try{const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();gain=ctx.createGain();gain.gain.value=0;
  ctx.createMediaElementSource(bgm).connect(gain);gain.connect(ctx.destination);}catch(e){ctx=gain=null;bgm.volume=0;}
function setVol(v){if(!bgmOn)v=0;if(gain)gain.gain.setTargetAtTime(v,ctx.currentTime,.4);else bgm.volume=v;}
function bgmNormal(){setVol(BGM.vol);}
function bgmStart(){bgmStarted=true;try{ctx&&ctx.resume();}catch(e){}bgm.play().then(bgmNormal).catch(()=>{});}
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else if(bgmStarted)bgm.play().catch(()=>{});});
function initTitle(){
  const t=$('title');
  t.style.setProperty('--bgi',`url(${IMG.titleBg})`);
  t.innerHTML=`<div id="tbox"><img id="timg" src="${IMG.titleBg}" alt="">
  <div id="tright"><div id="tlogo"><span class="dk">두근두근♥</span><div class="lt o">유우쨩<br>호감도 올리기!</div><span class="rb">🎀</span><div class="sb">~ 러브 스토리 ~</div></div>
  <button class="bubble" id="start">시작하기</button></div></div>`;
  sparkle(t,24);
  $('start').onclick=e=>{e.stopPropagation();
    try{const el=document.documentElement;const f=el.requestFullscreen?el.requestFullscreen():null;Promise.resolve(f).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{});}catch(x){}
    bgmStart();t.style.display='none';$('gauge').style.display='flex';$('mini').style.display='block';$('nav').style.display='flex';i=0;love=0;upd();show();};
}
function upd(){
  const n=Math.min(5,Math.floor(love/20));
  $('hearts').textContent='♥'.repeat(n)+'♡'.repeat(5-n);$('num').textContent=love;
}
function say(who,text){
  $('name').textContent=who;$('box').style.display='block';$('next').style.visibility='hidden';
  full=text;let n=0;$('txt').textContent='';clearInterval(typing);
  typing=setInterval(()=>{n++;$('txt').textContent=full.slice(0,n);
    if(n>=full.length){clearInterval(typing);typing=null;$('next').style.visibility='visible';doneAt=Date.now();}},28);
}
function show(){
  const n=S[i];if(!n)return finish();
  if(n.q){
    skip=false;$('skip').classList.remove('on');
    $('box').style.display='none';const c=$('choices');c.style.display='flex';
    c.querySelectorAll('.ch').forEach(e=>e.remove());$('q').textContent=n.q;
    n.o.forEach(o=>{const b=document.createElement('button');b.className='ch';b.textContent=o.t;
      b.onclick=e=>{e.stopPropagation();pick(o);};c.appendChild(b);});
    return;
  }
  setBg(n.bg);$('dim').style.opacity=n.dim?1:0;$('sprite').innerHTML=n.v!==undefined?vidHTML(n):spriteHTML(n.sp);
  const mv=$('sprite').querySelector('video');if(mv)playVid(mv,()=>{$('sprite').innerHTML=spriteHTML(n.sp);});else bgmNormal();
  say(n.who,n.t);
}
function lastBg(k){for(let j=k;j>=0;j--)if(S[j].bg)return S[j].bg;return'school';}
function pick(o){
  $('choices').style.display='none';love+=o.p;upd();burst();
  const p=$('pop');p.textContent='♥ +'+o.p;p.classList.remove('go');void p.offsetWidth;p.classList.add('go');
  S.splice(i+1,0,{bg:lastBg(i),sp:REPLY[lastBg(i)]||'yuu_hi',who:'유우시',t:o.r,v:o.v,vl:o.t});i++;show();
}
function advance(){
  if(typing){clearInterval(typing);typing=null;$('txt').textContent=full;$('next').style.visibility='visible';doneAt=Date.now();return;}
  if($('choices').style.display==='flex'||$('title').style.display!=='none'||$('end').style.display==='flex')return;
  i++;show();
}
function finish(){
  $('box').style.display='none';$('sprite').innerHTML='';$('gauge').style.display='none';$('mini').style.display='none';$('nav').style.display='none';
  const e=$('end'),ok=love>=THRESHOLD;e.style.display='flex';e.style.setProperty('--bgi',`url(${IMG.endPoster})`);
  const head=ok?'HAPPY END ♥ 유우시와 사귀게 됐어요':'친한 선후배 엔딩 🌸';
  const sub=ok?`호감도 ${love}점 · “선배, 앞으로도 쭉 같이 있어줘요…!”`:`호감도 ${love}점 · 조금만 더 다가가 볼까요?`;
  e.innerHTML=`<div id="ew">${IMG.endVideo?`<video id="ev" src="${IMG.endVideo}" poster="${IMG.endPoster}" preload="auto" loop playsinline></video>`:''}<div id="et"><div class="eh o">${head}</div><div class="es">${sub}</div><button class="wing" id="again">♥ 게임 다시하기 ♥</button></div></div>`;
  const v=$('ev');if(v)playVid(v);
  $('again').onclick=ev=>{ev.stopPropagation();location.reload();};
}
$('stage').addEventListener('click',advance);
$('home').onclick=e=>{e.stopPropagation();location.reload();};
$('mute').onclick=e=>{e.stopPropagation();bgmOn=!bgmOn;$('mute').textContent=bgmOn?'♪ ON':'♪ OFF';setVol(bgmOn?BGM.vol:0);};
$('skip').onclick=e=>{e.stopPropagation();skip=!skip;$('skip').classList.toggle('on',skip);};
$('auto').onclick=e=>{e.stopPropagation();auto=!auto;$('auto').classList.toggle('on',auto);};
setInterval(()=>{
  if($('choices').style.display==='flex'||$('title').style.display!=='none'||$('end').style.display==='flex')return;
  if(skip)advance();else if(auto&&!typing&&doneAt&&Date.now()-doneAt>1800)advance();
},140);
initTitle();setBg('gate');
</script>
</body>
</html>
